<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo5.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyBookClub — a real-time book club platform for readers. Create clubs, chat, vote on books, and track your reading." />
    <meta name="theme-color" content="#1e1e2e" />
    <meta property="og:title" content="MyBookClub" />
    <meta property="og:description" content="A real-time community platform for reading groups." />
    <meta property="og:type" content="website" />
    <title>MyBookClub</title>

    <!-- Preload the LCP image — homepage hero. Browser starts fetching
         this in parallel with the main JS bundle parse, so the image
         is already in cache by the time React mounts and renders the
         <img>. Without this, the LCP image fetch waits ~1.5-3s for
         JS to finish executing (SPA cold-start tax). `fetchpriority`
         + `as="image"` tells the browser this is the largest above-the-
         fold visual — it skips the rest of the network queue. -->
    <link
      rel="preload"
      as="image"
      href="/images/bookclub-chat.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Web fonts: preconnect to warm up TLS to fonts.googleapis.com
         before the stylesheet request lands, then load the stylesheet
         non-render-blocking (media=print + onload swap is the standard
         async-CSS trick — browser fetches it without delaying first
         paint, then promotes it to media=all once loaded). The
         `display=swap` directive in the URL paints fallback text
         immediately and swaps to the web font on download. Combined
         this got us back ~1.75s of FCP that the previous CSS @import
         was eating. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
